[package]
name = "lumo"
version = "0.1.0"
description = "Lumo: a local-first, read-only system monitor for Windows."
authors = ["Navil"]
license = "MIT"
repository = "https://github.com/NavilWorks/lumo"
edition = "2021"
rust-version = "1.80"

[lib]
# Suffix avoids a name clash between the lib and bin targets on Windows.
name = "lumo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
